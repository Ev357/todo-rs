[workspace]
resolver = "2"
members = [
  "todo-ui",
  "todo-web",
  "todo-desktop",
  "todo-mobile",
  "todo-api",
  "todo-server",
]

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
todo-server = { path = "todo-server", default-features = false }
todo-api = { path = "todo-api" }

dioxus = { git = "https://github.com/Ev357/dioxus", branch = "feat/query-method" }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "uuid"] }
tokio = { version = "1.53.1", features = ["full"] }
color-eyre = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
axum = { git = "https://github.com/tokio-rs/axum", features = ["macros"] }
tower = "0.5.3"
reqwest = { version = "0.13.4", features = ["json"] }
indexmap = { version = "2.14.2", features = ["serde"] }
uuid = { version = "1.26.1", features = ["serde"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }

[workspace.lints.clippy]
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
