[workspace]
resolver = "2"
members = [
  "packages/ui",
  "packages/web",
  "packages/desktop",
  "packages/mobile",
  "packages/api",
  "todo-server",
]

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
dioxus = { version = "0.7.1" }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["full"] }
color-eyre = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
axum = { version = "0.8.9", features = ["macros"] }

ui = { path = "packages/ui" }
api = { path = "packages/api" }

[workspace.lints.clippy]
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
