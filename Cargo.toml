[workspace]
resolver = "2"
members = [
  "todo-ui",
  "todo-web",
  "todo-desktop",
  "todo-mobile",
  "todo-api",
  "todo-server",
]

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
dioxus = { version = "0.7.1" }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["full"] }
color-eyre = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
axum = { version = "0.8.9", features = ["macros"] }

todo-ui = { path = "todo-ui" }
todo-api = { path = "todo-api" }

[workspace.lints.clippy]
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
