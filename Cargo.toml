[workspace]
resolver = "2"
members = [
  "todo-ui",
  "todo-web",
  "todo-desktop",
  "todo-mobile",
  "todo-api",
  "todo-server",
]

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
todo-server = { path = "todo-server", default-features = false }
todo-api = { path = "todo-api" }

dioxus = { git = "https://github.com/Ev357/dioxus", branch = "feat/query-method" }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["full"] }
color-eyre = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
axum = { git = "https://github.com/tokio-rs/axum", features = ["macros"] }
reqwest = { version = "0.13.4", features = ["json"] }

[workspace.lints.clippy]
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
