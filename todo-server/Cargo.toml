[package]
name = "todo-server"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
color-eyre = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

[features]
default = ["server"]
server = [
    "sqlx",
    "dep:tokio",
    "dep:color-eyre",
    "dep:axum",
    "uuid/v4",
]
sqlx = ["dep:sqlx"]

[[bin]]
name = "todo-server"
path = "src/main.rs"
required-features = ["server"]
