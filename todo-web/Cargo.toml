[package]
name = "todo-web"
description = "Web server for todo-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
todo-api = { workspace = true }
todo-server = { workspace = true, default-features = false }

dioxus = { workspace = true, features = ["router", "fullstack"] }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
serde_urlencoded = { workspace = true }
tower = { workspace = true, optional = true }
indexmap = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "todo-api/server", "dep:serde_json", "dep:tower"]
